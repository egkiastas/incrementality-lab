[project]
name = "incrementality-lab"
version = "0.1.0"
description = "Average effects, variance reduction, sequential testing and uplift targeting on the Criteo Uplift v2.1 experiment."
authors = [{ name = "Vangelis Gkiastas" }]
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=2.1,<3",
    "duckdb>=2.0,<3",
    "scikit-learn>=1.6,<1.10",
    "lightgbm>=4.5,<5",
    "econml==0.17.1",
    "joblib>=1.4",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "mypy>=1.15",
    "scipy-stubs>=1.14",
    "scikit-uplift==0.5.1",  # reference implementation the Qini/AUUC tests compare against
]
report = ["jupytext>=1.16", "nbconvert>=7.16", "nbformat>=5.10", "ipykernel>=6.29"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "incrementality"
module-root = ""

[tool.uv]
default-groups = ["dev", "report"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"report/report.py" = ["E402", "E501"]
"analysis/*.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
files = ["incrementality"]
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
